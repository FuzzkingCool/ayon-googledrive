# Runtime: Alpine container — NOT ubuntu-latest (see runbook § CI runtime).
# Release tags: bare package.py version (AYON canonical) — no "v" prefix.
# Tags are created locally via create_tag_from_version.py; CI never mutates tags.
name: Release Addon Package

on:
  workflow_dispatch:
    inputs:
      draft:
        type: boolean
        description: Create as draft release
        required: false
        default: false
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-alpine3.20
    steps:
      - uses: actions/checkout@v4

      - name: Read addon version
        id: meta
        run: |
          VERSION=$(python -c "ns={}; exec(open('package.py', encoding='utf-8').read(), ns); print(ns['version'])")
          NAME=$(python -c "ns={}; exec(open('package.py', encoding='utf-8').read(), ns); print(ns['name'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.py (tag push only)
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          test "$TAG" = "${{ steps.meta.outputs.version }}"

      - name: Build addon zip
        run: python create_package.py --output dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.version || github.ref_name }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          files: dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.zip
