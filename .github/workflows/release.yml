# Runtime: Alpine container — NOT ubuntu-latest (see runbook § CI runtime).
# Do not use actions/setup-python; the container image ships Python.
name: Release Addon Package

on:
  workflow_dispatch:
    inputs:
      draft:
        type: boolean
        description: Create as draft release
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-alpine3.20
    steps:
      - uses: actions/checkout@v4

      - name: Read addon version
        id: meta
        run: |
          VERSION=$(python -c "ns={}; exec(open('package.py', encoding='utf-8').read(), ns); print(ns['version'])")
          NAME=$(python -c "ns={}; exec(open('package.py', encoding='utf-8').read(), ns); print(ns['name'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        run: python create_package.py --output dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.meta.outputs.version) || github.ref_name }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          files: dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.zip
