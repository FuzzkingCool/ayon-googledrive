# Studio-private / non-spork: CI on develop.
# Runtime: Alpine container — NOT ubuntu-latest (see runbook § CI runtime).
name: CI Lint

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-alpine3.20
    steps:
      - uses: actions/checkout@v6

      - name: Ruff
        run: |
          pip install --no-cache-dir ruff
          ruff check .
