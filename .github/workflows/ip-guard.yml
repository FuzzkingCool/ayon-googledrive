# IP scan on PRs — Alpine container (NOT ubuntu-latest).
name: IP Guard

on:
  pull_request:
    branches:
      - "patched/**"
      - develop
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ip-guard:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-alpine3.20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PipelineEngineering (IP config + scanner)
        uses: actions/checkout@v4
        with:
          repository: FuzzkingCool/PipelineEngineering
          path: pipeline-engineering
          fetch-depth: 1

      - name: Scan repository
        run: |
          apk add --no-cache git
          git add -A
          python pipeline-engineering/scripts/utils/ip_protect_scan.py \
            --staged \
            --repo . \
            --config-dir pipeline-engineering/config
